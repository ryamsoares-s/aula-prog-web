<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Desafio 3 - Card de produto</title>
	<link rel="stylesheet" href="estilo.css" />
</head>

<body>

	<div class="card">

		<div class="card-imagem">
			<img src="img/fone-de-ouvido.jpg" alt="Fone de ouvido Grado SR80e segurado na mão" />
			<span class="selo">-20%</span>
		</div>

		<div class="card-conteudo">

			<h2>Fone de Ouvido Grado SR80e</h2>

			<p class="descricao">
				Fone over-ear aberto, com drivers de 44&nbsp;mm e espuma removível.
				Som equilibrado e cabo destacável de 2&nbsp;m.
			</p>

			<p class="preco">
				<span class="preco-antigo">R$ 1.499,00</span>
				R$ 1.199,00
			</p>

			<!-- Passe o mouse por cima do botão para ver o efeito de :hover -->
			<button class="botao" type="button">Adicionar ao carrinho</button>

		</div>

	</div>

</body>
</html>
