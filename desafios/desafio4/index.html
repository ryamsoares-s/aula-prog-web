<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Desafio 4 - Galeria de fotos</title>
	<link rel="stylesheet" href="estilo.css" />
</head>

<body>

	<h1>Mato Grosso em 4 fotos</h1>
	<p class="subtitulo">Um passeio pelo Cerrado, pela Chapada e pelo Pantanal.</p>

	<!-- Este <div> é o contêiner: é nele que o display: flex é aplicado.
	     Cada <figure> lá dentro vira um item da linha. -->
	<div class="galeria">

		<figure>
			<img src="img/veu-de-noiva.jpg" alt="Cachoeira Véu de Noiva despencando de um paredão de arenito" />
			<figcaption>Cachoeira Véu de Noiva, Chapada dos Guimarães</figcaption>
		</figure>

		<figure>
			<img src="img/araras.jpg" alt="Casal de araras-vermelhas voando lado a lado" />
			<figcaption>Araras-vermelhas no Parque Nacional da Chapada</figcaption>
		</figure>

		<figure>
			<img src="img/onca-pintada.jpg" alt="Onça-pintada macho na margem de um rio do Pantanal" />
			<figcaption>Onça-pintada às margens do Rio Negro</figcaption>
		</figure>

		<figure>
			<img src="img/pantanal.jpg" alt="Planície alagada do Pantanal vista de cima" />
			<figcaption>A planície alagada do Pantanal</figcaption>
		</figure>

	</div>

</body>
</html>
